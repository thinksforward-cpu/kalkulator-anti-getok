<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Perbaikan Rumah - Anti Getok</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f7f6; color: #333; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: #fff; width: 100%; max-width: 480px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; margin-bottom: 20px; color: #2c3e50; font-size: 22px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; margin-top: 10px; }
        button:hover { background-color: #219653; }
        .btn-lynk { background-color: #2980b9; margin-top: 15px; text-decoration: none; display: block; text-align: center; color: white; padding: 12px; border-radius: 8px; font-weight: bold; }
        .btn-lynk:hover { background-color: #1f618d; }
        .hidden { display: none !important; }
        .result-box { background: #e8f8f5; border: 1px solid #a3e4d7; padding: 15px; border-radius: 8px; margin-top: 20px; }
        .result-box p { margin-bottom: 8px; font-size: 14px; }
        
        /* Kotak Status Informasi */
        .status-box { margin-top: 15px; padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; text-align: center; }
        .status-loading { background: #fef9e7; border: 1px solid #f9e79f; color: #b7950b; }
        .status-success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; font-weight: bold; }
        .status-error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🛠️ Kalkulator Anti-Getok Servis</h2>

        <!-- TAHAP 1: FORM CEK AKSES / EMAIL -->
        <div id="auth-section">
            <p style="text-align: center; margin-bottom: 15px; font-size: 14px; color: #666;">
                Masukkan email terdaftar Anda untuk mulai mencocokkan akses dengan database.
            </p>
            <div class="form-group">
                <label for="emailInput">Email Terdaftar:</label>
                <input type="email" id="emailInput" placeholder="contoh: thinksforward@gmail.com" required>
            </div>
            <button onclick="cekAkses()">Cek & Cocokkan Email</button>

            <!-- Elemen Keterangan Status Pencocokan -->
            <div id="statusBox" class="status-box hidden"></div>

            <hr style="margin: 20px 0; border: none; border-top: 1px solid #eee;">
            
            <p style="text-align: center; font-size: 13px; color: #555;">Belum punya akses / kuota analisa?</p>
            <a href="https://lynk.id/thinksforward" target="_blank" class="btn-lynk">Beli Akses via Lynk.id 🚀</a>
        </div>

        <!-- TAHAP 2: HALAMAN UTAMA KALKULATOR -->
        <div id="calculator-section" class="hidden">
            <div style="background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; text-align: center; margin-bottom: 15px; font-size: 13px; font-weight: bold;">
                ✅ Pencocokan Berhasil! Akses Terbuka.
            </div>

            <div class="form-group">
                <label>Pilih Kerusakan / Komponen:</label>
                <select id="komponen">
                    <option value="150000">Kapasitor / Modul Ringan (Estimasi: Rp 150rb)</option>
                    <option value="450000">Dinamo / Kompresor (Estimasi: Rp 450rb)</option>
                    <option value="850000">Modul Utama / PCB (Estimasi: Rp 850rb)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tarif Jasa Teknisi di Tempat:</label>
                <input type="number" id="ongkos" placeholder="Contoh: 75000" value="50000">
            </div>

            <button onclick="hitungPerbaikan()">Hitung Kewajaran Harga</button>

            <div id="hasilAnalisis" class="result-box hidden">
                <p><strong>Rekomendasi Keputusan:</strong> <span id="resKeputusan">-</span></p>
                <p><strong>Wajar Total Biaya:</strong> <span id="resTotal">-</span></p>
                <p><strong>Saran Tindakan:</strong> <span id="resSaran">-</span></p>
            </div>
            
            <button onclick="logoutSession()" style="background-color: #e74c3c; margin-top: 25px; font-size: 13px; padding: 8px;">Ganti / Keluar Email</button>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://api-antigetok.thinksforward.workers.dev/cek-akses";

        async function cekAkses() {
            const email = document.getElementById("emailInput").value.trim().toLowerCase();
            const statusBox = document.getElementById("statusBox");

            if (!email) {
                statusBox.className = "status-box status-error";
                statusBox.innerText = "❌ Gagal: Mohon ketik alamat email Anda terlebih dahulu!";
                statusBox.classList.remove("hidden");
                return;
            }

            // Tampilkan status sedang mencocokkan
            statusBox.className = "status-box status-loading";
            statusBox.innerText = "⏳ Sedang mencocokkan email ke server & database...";
            statusBox.classList.remove("hidden");

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (result.lunas === true) {
                    statusBox.className = "status-box status-success";
                    statusBox.innerText = "✅ Pencocokan Berhasil! Membuka kalkulator...";
                    
                    // Beri jeda 1 detik agar pengguna sempat membaca pesan sukses, lalu buka halaman utama
                    setTimeout(() => {
                        localStorage.setItem("antigetok_email", email);
                        document.getElementById("auth-section").classList.add("hidden");
                        document.getElementById("calculator-section").classList.remove("hidden");
                    }, 1000);

                } else {
                    statusBox.className = "status-box status-error";
                    statusBox.innerText = "❌ Pencocokan Gagal: Email '" + email + "' tidak ditemukan atau belum lunas di database.";
                }
            } catch (err) {
                statusBox.className = "status-box status-error";
                statusBox.innerText = "❌ Error Sistem: Gagal terhubung ke Cloudflare Worker. (" + err.message + ")";
            }
        }

        function hitungPerbaikan() {
            const hargaPart = Number(document.getElementById("komponen").value);
            const ongkosJasa = Number(document.getElementById("ongkos").value) || 0;
            const totalWajar = hargaPart + ongkosJasa;

            const box = document.getElementById("hasilAnalisis");
            box.classList.remove("hidden");

            document.getElementById("resKeputusan").innerText = "Wajar / Layak Servis";
            document.getElementById("resTotal").innerText = "Rp " + totalWajar.toLocaleString("id-ID");
            document.getElementById("resSaran").innerText = "Komponen dan tarif jasa berada dalam batas wajar.";
        }

        function logoutSession() {
            localStorage.removeItem("antigetok_email");
            document.getElementById("calculator-section").classList.add("hidden");
            document.getElementById("auth-section").classList.remove("hidden");
            document.getElementById("emailInput").value = "";
            document.getElementById("statusBox").classList.add("hidden");
        }
    </script>
</body>
</html>
