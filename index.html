<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Anti-Getok Servis</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { 
            background: linear-gradient(135deg, #141414 0%, #1f1f1f 100%); 
            color: #e50914; 
            padding: 20px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }
        .container { 
            background: rgba(20, 20, 20, 0.95); 
            border: 1px solid #333;
            width: 100%; 
            max-width: 500px; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.7); 
            color: #fff;
        }
        h2 { text-align: center; margin-bottom: 20px; color: #e50914; font-size: 24px; letter-spacing: 0.5px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; font-size: 14px; color: #b3b3b3; }
        input, select { 
            width: 100%; 
            padding: 14px; 
            background: #333;
            border: 1px solid #444; 
            color: #fff;
            border-radius: 6px; 
            font-size: 15px; 
        }
        input:focus, select:focus { outline: none; border-color: #e50914; }
        button { 
            width: 100%; 
            padding: 14px; 
            background-color: #e50914; 
            color: white; 
            border: none; 
            border-radius: 6px; 
            font-size: 16px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s; 
            margin-top: 10px; 
        }
        button:hover { background-color: #b20710; }
        .btn-lynk { 
            background-color: #0071eb; 
            margin-top: 15px; 
            text-decoration: none; 
            display: block; 
            text-align: center; 
            color: white; 
            padding: 14px; 
            border-radius: 6px; 
            font-weight: bold; 
        }
        .btn-lynk:hover { background-color: #005bb5; }
        .hidden { display: none !important; }
        
        .result-box { 
            background: #222; 
            border: 1px solid #e50914; 
            padding: 18px; 
            border-radius: 8px; 
            margin-top: 20px; 
        }
        .result-box p { margin-bottom: 10px; font-size: 15px; color: #fff; }
        .result-box span { color: #46d369; font-weight: bold; }
        
        .status-box { margin-top: 15px; padding: 12px; border-radius: 6px; font-size: 13px; line-height: 1.4; text-align: center; }
        .status-loading { background: #332701; border: 1px solid #b7950b; color: #f1c40f; }
        .status-success { background: #0e3b1c; border: 1px solid #27ae60; color: #2ecc71; font-weight: bold; }
        .status-error { background: #3b0e0e; border: 1px solid #c0392b; color: #e74c3c; }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎬 Kalkulator Anti-Getok Servis</h2>

        <!-- TAHAP 1: FORM CEK AKSES / EMAIL -->
        <div id="auth-section">
            <p style="text-align: center; margin-bottom: 20px; font-size: 14px; color: #b3b3b3;">
                Masukkan email terdaftar Anda untuk membuka akses kalkulator.
            </p>
            <div class="form-group">
                <label for="emailInput">Email Terdaftar:</label>
                <input type="email" id="emailInput" placeholder="contoh: thinksforward@gmail.com" required>
            </div>
            <button onclick="cekAkses()">Cek & Cocokkan Email</button>

            <div id="statusBox" class="status-box hidden"></div>

            <hr style="margin: 25px 0; border: none; border-top: 1px solid #333;">
            
            <p style="text-align: center; font-size: 13px; color: #b3b3b3;">Belum punya akses / kuota analisa?</p>
            <a href="https://lynk.id/thinksforward" target="_blank" class="btn-lynk">Beli Akses via Lynk.id 🚀</a>
        </div>

        <!-- TAHAP 2: HALAMAN UTAMA KALKULATOR -->
        <div id="calculator-section" class="hidden">
            <div style="background: #0e3b1c; color: #2ecc71; padding: 12px; border-radius: 6px; text-align: center; margin-bottom: 20px; font-size: 13px; font-weight: bold; border: 1px solid #27ae60;">
                ✅ Akses Terverifikasi & Aktif
            </div>

            <div class="form-group">
                <label>Pilih Kerusakan / Komponen:</label>
                <select id="komponen">
                    <option value="150000">Kapasitor / Modul Ringan (Estimasi: Rp 150rb)</option>
                    <option value="450000">Dinamo / Kompresor (Estimasi: Rp 450rb)</option>
                    <option value="850000">Modul Utama / PCB (Estimasi: Rp 850rb)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Tarif Jasa Teknisi di Tempat:</label>
                <input type="number" id="ongkos" placeholder="Contoh: 75000" value="50000">
            </div>

            <button onclick="hitungPerbaikan()">Hitung Kewajaran Harga</button>

            <div id="hasilAnalisis" class="result-box hidden">
                <p><strong>Rekomendasi Keputusan:</strong> <span id="resKeputusan">-</span></p>
                <p><strong>Wajar Total Biaya:</strong> <span id="resTotal">-</span></p>
                <p><strong>Saran Tindakan:</strong> <span id="resSaran">-</span></p>
            </div>
            
            <button onclick="logoutSession()" style="background-color: #333; color: #b3b3b3; margin-top: 25px; font-size: 13px; padding: 10px;">Ganti / Keluar Email</button>
        </div>
    </div>

    <script>
        const WORKER_URL = "https://api-antigetok.thinksforward.workers.dev/cek-akses";

        window.onload = function() {
            const savedEmail = localStorage.getItem("antigetok_email");
            if (savedEmail) {
                document.getElementById("emailInput").value = savedEmail;
                cekAkses(true);
            }
        };

        async function cekAkses(isAuto = false) {
            const email = document.getElementById("emailInput").value.trim().toLowerCase();
            const statusBox = document.getElementById("statusBox");

            if (!email) {
                if (!isAuto) {
                    statusBox.className = "status-box status-error";
                    statusBox.innerText = "❌ Mohon masukkan alamat email Anda!";
                    statusBox.classList.remove("hidden");
                }
                return;
            }

            if (!isAuto) {
                statusBox.className = "status-box status-loading";
                statusBox.innerText = "⏳ Sedang mencocokkan email ke server...";
                statusBox.classList.remove("hidden");
            }

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (result.lunas === true) {
                    if (!isAuto) {
                        statusBox.className = "status-box status-success";
                        statusBox.innerText = "✅ Pencocokan Berhasil! Membuka kalkulator...";
                    }
                    
                    setTimeout(() => {
                        localStorage.setItem("antigetok_email", email);
                        document.getElementById("auth-section").classList.add("hidden");
                        document.getElementById("calculator-section").classList.remove("hidden");
                    }, isAuto ? 0 : 800);

                } else {
                    if (!isAuto) {
                        statusBox.className = "status-box status-error";
                        statusBox.innerText = "❌ Email belum terdaftar atau belum lunas.";
                    }
                }
            } catch (err) {
                if (!isAuto) {
                    statusBox.className = "status-box status-error";
                    statusBox.innerText = "❌ Gagal terhubung ke server worker.";
                }
            }
        }

        function hitungPerbaikan() {
            const hargaPart = Number(document.getElementById("komponen").value);
            const ongkosJasa = Number(document.getElementById("ongkos").value) || 0;
            const totalWajar = hargaPart + ongkosJasa;

            const box = document.getElementById("hasilAnalisis");
            box.classList.remove("hidden");

            document.getElementById("resKeputusan").innerText = "Wajar / Layak Servis";
            document.getElementById("resTotal").innerText = "Rp " + totalWajar.toLocaleString("id-ID");
            document.getElementById("resSaran").innerText = "Komponen dan tarif jasa berada dalam batas wajar.";
        }

        function logoutSession() {
            localStorage.removeItem("antigetok_email");
            document.getElementById("calculator-section").classList.add("hidden");
            document.getElementById("auth-section").classList.remove("hidden");
            document.getElementById("emailInput").value = "";
            document.getElementById("statusBox").classList.add("hidden");
        }
    </script>
</body>
</html>
